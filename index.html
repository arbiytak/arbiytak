<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motors Egypt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff;max-width:480px;margin:auto;padding-bottom:90px}
.top{padding:16px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:23px;font-weight:900}.top h1 span{color:#00AA06}
.bell{width:40px;height:40px;border:1px solid #eee;border-radius:50%;display:flex;align-items:center;justify-content:center}
.filters{margin:0 16px;display:flex;gap:8px}
.filters select{flex:1;background:#f3f3f3;border:none;border-radius:12px;padding:11px;font-weight:700}
.search{margin:12px 16px 0;background:#f3f3f3;border-radius:14px;padding:13px;display:flex;gap:8px}
.search input{flex:1;background:transparent;border:none;outline:none;font-size:15px}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.tabs button{white-space:nowrap;border:1px solid #eee;background:#fff;padding:9px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.tabs button.active{background:#00AA06;color:#fff}
.sec{padding:4px 16px;font-size:19px}
.brands{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px}
.brand{border:1px solid #eee;border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer}
.brand img{width:44px;height:44px;object-fit:contain}
.brand p{font-size:12px;margin-top:4px}.brand.active{border-color:#00AA06;background:#eaffea}
.latest{padding:12px 16px 0;display:flex;justify-content:space-between}
.latest a{color:#00AA06;text-decoration:none;font-weight:800}
.grid{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.08);position:relative}
.card img{width:100%;height:110px;object-fit:cover}
.cb{padding:10px}.cb h3{font-size:13px;line-height:1.4}
.price{color:#00AA06;font-weight:900;font-size:15px;margin-top:4px}
.meta{color:#777;font-size:11px;margin-top:4px}
.wa{display:block;text-align:center;background:#00AA06;color:#fff;text-decoration:none;padding:8px;border-radius:10px;font-weight:800;font-size:13px;margin-top:8px}
.editrow{display:flex;gap:6px;margin-top:6px}
.editrow button{flex:1;border:1px solid #eee;background:#f8f8f8;padding:6px;border-radius:8px;font-size:12px;cursor:pointer}
.add{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#00AA06;color:#fff;border:none;padding:14px 22px;border-radius:999px;font-weight:900;z-index:10;box-shadow:0 4px 15px rgba(0,170,6,.4)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
nav a{text-decoration:none;color:#333;text-align:center;font-size:13px}
nav a.active{color:#00AA06;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:end}
.modal.open{display:flex}
.mb{background:#fff;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto}
.mb input,.mb select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin:6px 0 12px}
.mb button{width:100%;background:#00AA06;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900}
.pkg{display:flex;gap:8px;margin:6px 0 12px}
.pkg div{flex:1;border:2px solid #eee;border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:13px}
.pkg div.sel{border-color:#00AA06;background:#eaffea}
</style>
</head>
<body>
<div class="top"><h1><span style="border:2px solid #00AA06;border-radius:10px;padding:2px 6px">🚗</span> Motors <span>Egypt</span></h1><div class="bell">🔔</div></div>
<div class="filters">
<select id="country" onchange="ap()"><option value="">كل الدول</option><option value="مصر">🇪🇬 مصر</option><option value="السعودية">🇸🇦 السعودية</option><option value="الإمارات">🇦🇪 الإمارات</option><option value="الكويت">🇰🇼 الكويت</option></select>
<select id="cityF" onchange="ap()"><option value="">كل المدن</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>المنصورة</option><option>الزقازيق</option><option>الحسينية</option><option>الرياض</option><option>جدة</option><option>دبي</option></select>
</div>
<div class="search">🔍<input id="s" placeholder="دور على عربيتك"><span>⚙️</span></div>
<div class="tabs"><button class="active" onclick="fc('الكل',this)">الكل</button><button onclick="fc('كسر زيرو',this)">كسر زيرو</button><button onclick="fc('مستعمل',this)">مستعمل</button><button onclick="fc('زيرو',this)">زيرو</button></div>
<h2 class="sec">ماركات السيارات</h2>
<div class="brands" id="brands"></div>
<div class="latest"><h2>أحدث العربيات</h2><a href="#">عرض الكل ‹</a></div>
<div class="grid" id="cars"></div>
<button class="add" onclick="om()">+ اعرض عربيتك</button>
<nav><a href="#" class="active">🏠<br>الرئيسية</a><a href="#" onclick="om()">➕<br>إضافة</a><a href="#">❤️<br>المفضلة</a></nav>
<div class="modal" id="modal"><div class="mb"><h2 id="mt">أضف عربيتك</h2><p style="color:#777;font-size:13px;margin:6px 0 14px">للمعارض والأفراد - باقات مدفوعة - الدفع فودافون كاش</p>
<label>اختر الباقة</label><div class="pkg"><div onclick="sp(0,this)">عادي<br><b>200 ج</b><br>7 أيام</div><div class="sel" onclick="sp(1,this)">مميز ⭐<br><b>500 ج</b><br>14 يوم</div><div onclick="sp(2,this)">معرض 👑<br><b>1500 ج</b><br>30 يوم</div></div>
<label>الماركة</label><select id="b"><option>Toyota</option><option>Hyundai</option><option>Kia</option><option>Nissan</option><option>MG</option><option>Chevrolet</option><option>BMW</option><option>Mercedes</option></select>
<label>الموديل</label><input id="m" placeholder="مثال: Corolla">
<label>السنة</label><input id="y" type="number" placeholder="2023">
<label>السعر</label><input id="p" type="number" placeholder="850000">
<label>الدولة</label><select id="co"><option>مصر</option><option>السعودية</option><option>الإمارات</option><option>الكويت</option></select>
<label>المدينة</label><select id="c"><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>المنصورة</option><option>الزقازيق</option><option>الحسينية</option><option>الرياض</option><option>جدة</option><option>دبي</option></select>
<label>الحالة</label><select id="k"><option>مستعمل</option><option>كسر زيرو</option><option>زيرو</option></select>
<label>رقم واتساب</label><input id="w" placeholder="01xxxxxxxxx">
<button id="sb" onclick="add()">ادفع وانشر - 500 ج</button><button style="background:#eee;color:#333;margin-top:8px" onclick="cm()">إلغاء</button></div></div>
<script>
let brands=[{n:'Toyota',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Toyota_logo_%28Red%29.svg/200px-Toyota_logo_%28Red%29.svg.png'},{n:'Hyundai',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Hyundai_Motor_Company_logo.svg/200px-Hyundai_Motor_Company_logo.svg.png'},{n:'Kia',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Kia-logo.svg/200px-Kia-logo.svg.png'},{n:'Nissan',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Nissan_logo.svg/200px-Nissan_logo.svg.png'},{n:'Chevrolet',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Chevrolet-logo.png/200px-Chevrolet-logo.png'},{n:'MG',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/MG_logo.svg/200px-MG_logo.svg.png'},{n:'BMW',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/BMW.svg/200px-BMW.svg.png'},{n:'Mercedes',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Mercedes-Logo.svg/200px-Mercedes-Logo.svg.png'}];
let cars=[
{a:'Toyota',m:'Toyota Corolla 2023',p:850000,c:'القاهرة',co:'مصر',y:2023,k:'كسر زيرو',img:'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800'},
{a:'Hyundai',m:'Hyundai Tucson 2022',p:1250000,c:'الجيزة',co:'مصر',y:2022,k:'مستعمل',img:'https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800'},
{a:'Kia',m:'Kia Sportage 2021',p:980000,c:'الإسكندرية',co:'مصر',y:2021,k:'مستعمل',img:'https://images.unsplash.com/photo-1619767886558-efdc259cde1a?w=800'},
{a:'Nissan',m:'Nissan Sunny 2022',p:620000,c:'المنصورة',co:'مصر',y:2022,k:'زيرو',img:'https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=800'},
{a:'Toyota',m:'Toyota Camry 2022',p:950000,c:'الزقازيق',co:'مصر',y:2022,k:'كسر زيرو',img:'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800'},
{a:'MG',m:'MG ZS 2022',p:680000,c:'الحسينية',co:'مصر',y:2022,k:'مستعمل',img:'https://images.unsplash.com/photo-1614200187524-dc4b892acf16?w=800'}
];
let cb='',ck='الكل',prices=[200,500,1500],curPrice=500,editIdx=-1;
function rb(){document.getElementById('brands').innerHTML=brands.map(x=>`<div class="brand ${cb===x.n?'active':''}" onclick="pb('${x.n}')"><img src="${x.img}"><p>${x.n}</p></div>`).join('')}
function pb(n){cb=cb===n?'':n;rb();ap()}
function rc(l){document.getElementById('cars').innerHTML=l.map((c,i)=>`<div class="card"><img src="${c.img}"><div class="cb"><h3>${c.m}</h3><div class="price">جنيه ${c.p.toLocaleString()}</div><div class="meta">📍 ${c.c} - ${c.co} • ${c.y} • ${c.k}</div><a class="wa" href="https://wa.me/201000000000">واتساب</a><div class="editrow"><button onclick="editCar(${i})">✏️ تعديل</button><button onclick="delCar(${i})">🗑️ حذف</button></div></div></div>`).join('')}
function fc(k,btn){ck=k;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');ap()}
function ap(){let q=document.getElementById('s').value;let co=document.getElementById('country').value;let ci=document.getElementById('cityF').value;let f=cars.filter(c=>(ck==='الكل'||c.k===ck)&&(cb===''||c.a===cb)&&(co===''||c.co===co)&&(ci===''||c.c===ci)&&(q===''||c.m.toLowerCase().includes(q.toLowerCase())));rc(f)}
function om(){editIdx=-1;document.getElementById('mt').innerText='أضف عربيتك';document.getElementById('sb').innerText='ادفع وانشر - '+curPrice+' ج';document.getElementById('modal').classList.add('open')}
function cm(){document.getElementById('modal').classList.remove('open')}
function sp(idx,el){curPrice=prices[idx];document.querySelectorAll('.pkg div').forEach(d=>d.classList.remove('sel'));el.classList.add('sel');document.getElementById('sb').innerText='ادفع وانشر - '+curPrice+' ج'}
function add(){let car={a:document.getElementById('b').value,m:document.getElementById('b').value+' '+document.getElementById('m').value+' '+document.getElementById('y').value,p:+document.getElementById('p').value||0,c:document.getElementById('c').value,co:document.getElementById('co').value,y:document.getElementById('y').value||2024,k:document.getElementById('k').value,img:'https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800'};if(editIdx>=0){cars[editIdx]=car;alert('تم التعديل ✅')}else{cars.unshift(car);alert('تم استلام طلبك ✅\nحول '+curPrice+' ج على فودافون كاش\nوهننشر عربيتك بعد التأكيد')}cm();ap()}
function editCar(i){let c=cars[i];editIdx=i;document.getElementById('mt').innerText='تعديل العربية';document.getElementById('m').value=c.m;document.getElementById('y').value=c.y;document.getElementById('p').value=c.p;document.getElementById('c').value=c.c;document.getElementById('co').value=c.co;document.getElementById('k').value=c.k;document.getElementById('sb').innerText='حفظ التعديل';document.getElementById('modal').classList.add('open')}
function delCar(i){if(confirm('تحذف العربية دي؟')){cars.splice(i,1);ap()}}
document.getElementById('s').addEventListener('input',ap);
rb();rc(cars);
</script>
</body>
</html>
