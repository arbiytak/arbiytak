<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عربيتك | سوق العربيات في مصر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8fbf8;max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}
.header{background:#00AA06;color:#fff;padding:22px 16px 32px;border-radius:0 0 24px 24px;text-align:center}
.header h1{font-size:28px;font-weight:900}
.header p{opacity:.9;font-size:14px;margin-top:4px}
.search{margin:-18px 16px 12px;background:#fff;border-radius:16px;padding:12px;display:flex;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.search input{flex:1;border:1px solid #eee;border-radius:12px;padding:12px;outline:none}
.search button{background:#00AA06;color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:800}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 16px}
.filters button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}
.filters button.active{background:#00AA06;color:#fff;border-color:#00AA06}
.section{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center}
.section h2{font-size:18px}
.grid{padding:12px 16px;display:grid;gap:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:12px}
.price{color:#00AA06;font-weight:900;font-size:19px}
.card-body h3{font-size:16px;margin:4px 0}
.meta{color:#777;font-size:13px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions a,.actions button{flex:1;text-align:center;padding:11px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px;cursor:pointer}
.wa{background:#25D366;color:#fff;border:none}
.details{background:#111;color:#fff;border:none}
.fav{position:absolute;top:10px;left:10px;background:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px}
.imgwrap{position:relative}
.add-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#00AA06;color:#fff;border:none;padding:14px 22px;border-radius:999px;font-weight:900;box-shadow:0 8px 20px rgba(0,170,6,.4);z-index:10}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
nav a{text-decoration:none;color:#333;text-align:center;font-size:13px}
nav a.active{color:#00AA06;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:end}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}
.modal-box input,.modal-box select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:6px;margin-bottom:12px}
.modal-box button{width:100%;background:#00AA06;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900}
</style>
</head>
<body>
<div class="header"><h1>🚗 عربيتك</h1><p>بيع واشتري عربيتك في مصر مجاناً</p></div>
<div class="search"><input id="searchInput" placeholder="دور على عربية... كور
