<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motors Egypt | عربيتك</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff;max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}
.top{padding:16px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:24px;font-weight:900}.top h1 span{color:#00AA06}
.bell{width:40px;height:40px;border:1px solid #eee;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.search{margin:0 16px;background:#f3f3f3;border-radius:14px;padding:13px;display:flex;gap:8px;align-items:center}
.search input{flex:1;background:transparent;border:none;outline:none;font-size:15px;text-align:right}
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.tabs button{white-space:nowrap;border:1px solid #eee;background:#fff;padding:9px 18px;border-radius:12px;cursor:pointer;font-weight:700}
.tabs button.active{background:#00AA06;color:#fff;border-color:#00AA06}
h2.sec{padding:4px 16px;font-size:19px}
.brands{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px}
.brand{border:1px solid #eee;border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;background:#fff}
.brand b{font-size:22px}.brand p{font-size:12px;margin-top:4px;color:#333}
.brand.active{border-color:#00AA06;background:#eaffea}
.latest{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center}
.latest a{color:#00AA06;text-decoration:none;font-weight:800}
.grid{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.card img{width:100%;height:110px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:13px;line-height:1.4}
.price{color:#00AA06;font-weight:900;font-size:15px;margin-top:4px}
.meta{color:#777;font-size:11px;margin-top:4px}
.wa-btn{display:block;text-align:center;background:#00AA06;color:#fff;text-decoration:none;padding:8px;border-radius:10px;font-weight:800;font-size:13px;margin-top:8px}
.add-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#00AA06;color:#fff;border:none;padding:14px 22px;border-radius:999px;font-weight:900;box-shadow:0 8px 20px rgba(0,170,6,.4);z-index:10}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
nav a{text-decoration:none;color:#333;text-align:center;font-size:13px}
nav a.active{color:#00AA06;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:end}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}
.modal-box input,.modal-box select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:6px;margin-bottom:12px}
.modal-box button{width:100%;background:#00AA06;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900}
</style>
</head>
<body>
<div class="top"><h1>Motors <span>Egypt</span></h1><div class="bell">🔔</div></div>
<div class="search">🔍<input id="searchInput" placeholder="دور على عربيتك"><span>⚙️</span></div>
<div class="tabs"><button class="active" onclick="filterCat('الكل',this)">الكل</button><button onclick="filterCat('كسر زيرو',this)">كسر زيرو</button><button onclick="filterCat('مستعمل',this)">مستعمل</button><button onclick="filterCat('زيرو',this)">زيرو</button></div>
<h2 class="sec">ماركات السيارات</h2>
<div class="brands" id="brands"></div>
<div class="latest"><h2>أحدث العربيات</h2><a href="#">عرض الكل ‹</a></div>
            <div class="grid" id="cars"></div>
<button class="add-btn" onclick="openModal()">+ اعرض عربيتك مجاناً</button>
<nav><a href="#" class="active">🏠<br>الرئيسية</a><a href="#" onclick="openModal()">➕<br>إضافة</a><a href="#">❤️<br>المفضلة</a></nav>
<div class="modal" id="modal"><div class="modal-box"><h2>أضف عربيتك</h2><p style="color:#777;font-size:13px;margin:6px 0 14px">للمعارض والأفراد - مجاناً</p><label>الماركة</label><select id="b"><option>Toyota</option><option>Hyundai</option><option>Kia</option><option>Nissan</option><option>MG</option><option>Chevrolet</option></select><label>الموديل</label><input id="m" placeholder="مثال: Corolla"><label>السنة</label><input id="y" type="number" placeholder="2023"><label>السعر</label><input id="p" type="number" placeholder="850000"><label>المدينة</label><select id="c"><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>المنصورة</option><option>الزقازيق</option><option>الحسينية</option></select><label>واتساب المعرض</label><input id="w" placeholder="01xxxxxxxxx"><button onclick="addCar()">انشر مجاناً</button><button style="background:#eee;color:#333;margin-top:8px" onclick="closeModal()">إلغاء</button></div></div>
<script>
let brands=[{n:'Toyota',e:'🚗'},{n:'Hyundai',e:'🚙'},{n:'Kia',e:'🚘'},{n:'Nissan',e:'🏎️'},{n:'Chevrolet',e:'🚐'},{n:'MG',e:'🛻'},{n:'BMW',e:'🏁'},{n:'Mercedes',e:'⭐'}];
let allCars=[
{brand:'Toyota',model:'Toyota Corolla 2023',price:850000,city:'القاهرة',year:2023,cat:'كسر زيرو',img:'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800',wa:'201000000000'},
{brand:'Hyundai',model:'Hyundai Tucson 2022',price:1250000,city:'الجيزة',year:2022,cat:'مستعمل',img:'https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800',wa:'201000000000'},
{brand:'Kia',model:'Kia Sportage 2021',price:980000,city:'الإسكندرية',year:2021,cat:'مستعمل',img:'https://images.unsplash.com/photo-1619767886558-efdc259cde1a?w=800',wa:'201000000000'},
{brand:'Nissan',model:'Nissan Sunny 2022',price:620000,city:'المنصورة',year:2022,cat:'زيرو',img:'https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=800',wa:'201000000000'},
{brand:'Toyota',model:'Toyota Camry 2022',price:950000,city:'الزقازيق',year:2022,cat:'كسر زيرو',img:'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800',wa:'201000000000'},
{brand:'MG',model:'MG ZS 2022',price:680000,city:'الحسينية',year:2022,cat:'مستعمل',img:'https://images.unsplash.com/photo-1614200187524-dc4b892acf16?w=800',wa:'201000000000'}
];
let curBrand='';let curCat='الكل';
function renderBrands(){document.getElementById('brands').innerHTML=brands.map(b=>`<div class="brand ${curBrand===b.n?'active':''}" onclick="pickBrand('${b.n}')"><b>${b.e}</b><p>${b.n}</p></div>`).join('')}
function pickBrand(n){curBrand=curBrand===n?'':n;renderBrands();apply()}
function render(list){document.getElementById('cars').innerHTML=list.map(c=>`<div class="card"><img src="${c.img}"><div class="card-body"><h3>${c.model}</h3><div class="price">جنيه ${c.price.toLocaleString()}</div><div class="meta">📍 ${c.city} • ${c.year} • ${c.cat}</div><a class="wa-btn" href="https://wa.me/${c.wa}">واتساب</a></div></div>`).join('')}
function filterCat(cat,btn){curCat=cat;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');apply()}
function apply(){let q=document.getElementById('searchInput').value;let f=allCars.filter(c=>(curCat==='الكل'||c.cat===curCat)&&(curBrand===''||c.brand===curBrand)&&(q===''||c.model.toLowerCase().includes(q.toLowerCase())));render(f)}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addCar(){let car={brand:document.getElementById('b').value,model:document.getElementById('b').value+' '+document.getElementById('m').value+' '+document.getElementById('y').value,price:+document.getElementById('p').value||0,city:document.getElementById('c').value,year:document.getElementById('y').value||2024,cat:'مستعمل',img:'https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800',wa:document.getElementById('w').value||'201000000000'};allCars.unshift(car);closeModal();apply();alert('تم النشر ✅')}
document.getElementById('searchInput').addEventListener('input',apply);
renderBrands();render(allCars);
</script>
</body>
</html>
