<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motors Egypt - اشتر وبيع السيارات في مصر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff;max-width:480px;margin:auto;padding-bottom:80px}
.appbar{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.appbar b{font-size:15px}
.appbar .install{background:#FFC500;border:none;padding:9px 26px;border-radius:8px;font-weight:900;font-size:15px}
.hero{background:#1B3A8F;padding:18px 16px 22px;color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:30px;line-height:1.3;font-weight:900;text-align:center}
.hero img{width:150px;display:block;margin:4px 0 10px}
.search{background:#fff;border-radius:10px;display:flex;padding:12px;gap:8px;align-items:center}
.search input{flex:1;border:none;outline:none;font-size:15px;text-align:right}
.search span{color:#1B3A8F}
.yellow{background:#FFC500;color:#000;text-align:center;padding:13px;border-radius:10px;font-weight:900;margin-top:12px;font-size:16px;cursor:pointer}
.filters{margin:0 16px;display:flex;gap:8px}
.filters select{flex:1;background:#f3f3f3;border:none;border-radius:12px;padding:11px;font-weight:700;margin-top:12px}
.tabs{display:flex;gap:18px;padding:16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #eee}
.tabs b{font-size:15px;color:#888;cursor:pointer;padding-bottom:6px}
.tabs b.active{color:#1B3A8F;border-bottom:3px solid #1B3A8F}
.brands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.brand{text-align:center;cursor:pointer;border-radius:12px;padding:10px}
.brand img{width:72px;height:58px;object-fit:contain}
.brand p{font-size:15px;font-weight:700;margin-top:6px}
.brand span{color:#888;font-size:13px}
.sec{padding:4px 16px;font-size:19px;font-weight:900}
.grid{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.card img{width:100%;height:110px;object-fit:cover}
.cb{padding:10px}.cb h3{font-size:13px;line-height:1.4}
.price{color:#00AA06;font-weight:900;font-size:15px;margin-top:4px}
.meta{color:#777;font-size:11px;margin-top:4px}
.wa{display:block;text-align:center;background:#00AA06;color:#fff;text-decoration:none;padding:8px;border-radius:10px;font-weight:800;font-size:13px;margin-top:8px}
.editrow{display:flex;gap:6px;margin-top:6px}
.editrow button{flex:1;border:1px solid #eee;background:#f8f8f8;padding:6px;border-radius:8px;font-size:12px;cursor:pointer}
.add{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#FFC500;color:#000;border:none;padding:13px 22px;border-radius:999px;font-weight:900;z-index:10}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
nav a{text-decoration:none;color:#777;text-align:center;font-size:12px;line-height:1.4}
nav a.active{color:#1B3A8F;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:end}
.modal.open{display:flex}
.mb{background:#fff;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto}
.mb input,.mb select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin:6px 0 12px}
.mb button{width:100%;background:#FFC500;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900}
.pkg{display:flex;gap:8px;margin:6px 0 12px}
.pkg div{flex:1;border:2px solid #eee;border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:13px}
.pkg div.sel{border-color:#1B3A8F;background:#EEF2FF}
</style>
</head>
<body>
<div class="appbar"><button class="install">تثبيت</button><b>هتلاقي تطبيق <span style="color:#888;font-weight:400">2+ مليون تثبيت</span></b><b>🚗</b></div>
<div class="hero">
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600">
<h1>اشترِ وبيع السيارات<br>في مصر</h1>
<div class="search"><span>🔍 اختر الماركة والموديل</span><input id="s" placeholder=""><span>⚙️</span></div>
<div class="yellow" onclick="document.getElementById('cars').scrollIntoView()">تصفح جميع السيارات</div>
</div>
<div class="filters">
<select id="country" onchange="ap()"><option value="">كل الدول</option><option value="مصر">🇪🇬 مصر</option><option value="السعودية">🇸🇦 السعودية</option><option value="الإمارات">🇦🇪 الإمارات</option></select>
<select id="cityF" onchange="ap()"><option value="">كل المدن</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>المنصورة</option><option>الزقازيق</option><option>الحسينية</option></select>
</div>
<div class="tabs"><b class="active">العلامات التجارية</b><b>أشهر الموديلات</b><b>مدن</b><b>معدل السعر</b></div>
<div class="brands" id="brands"></div>
<h2 class="sec">أحدث العربيات</h2>
<div class="grid" id="cars"></div>
<button class="add" onclick="om()">+ أضف إعلان</button>
<nav><a href="#" class="active">🏠<br>الرئيسية</a>
