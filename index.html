<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arbiytak - سجل معرضك</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:15px}
.box{background:#fff;max-width:480px;margin:auto;padding:20px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 15px}
label{display:block;margin:12px 0 5px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:10px;font-size:16px;cursor:pointer}
.btn-black{background:#111;color:#fff}
.btn-green{background:#16a34a;color:#fff;font-weight:bold;margin-top:15px}
.note{font-size:13px;color:#666;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>🏪 سجل معرضك لنفسك</h2>

<label>اسم المعرض</label>
<input id="s_name" placeholder="مثال: معرض النور للسيارات">

<label>المدينة - مكان المعرض</label>
<input id="s_city" placeholder="مثال: دمنهور - البحيرة">

<label>رقم التواصل - واتساب</label>
<input id="s_phone" placeholder="01xxxxxxxxx">

<label>رابط اللوكيشن - Google Maps</label>
<input id="s_location" placeholder="الصق هنا رابط لوكيشن المعرض">

<label>🔐 اختار الباسورد بتاعك</label>
<input id="s_pass" type="text" placeholder="مثال: most123">
<button class="btn-black" onclick="genPass()">🎲 ولدلي باسورد اتوماتيك</button>

<label>🔑 الرقم السري - 4 ارقام</label>
<input id="s_pin" type="text" maxlength="4" placeholder="مثال: 4589">
<button class="btn-black" onclick="genPin()">🎲 ولدلي رقم سري اتوماتيك</button>

<label>📦 اختار باقتك</label>
<select id="s_plan">
<option value="500">شهري - 500ج</option>
<option value="1200">3 شهور - 1200ج</option>
<option value="4000">سنوي - 4000ج</option>
</select>

<button class="btn-green" onclick="register()">✅ سجل معرضي</button>
<p class="note">اشتراك بس - مفيش عمولة - المشتري هيكلمك على رقمك وهيجيلك على اللوكيشن</p>
</div>

<script>
function genPass(){
  let chars="abcdefghijklmnopqrstuvwxyz1234567890";
  let p="";
  for(let i=0;i<6;i++){ p+=chars[Math.floor(Math.random()*chars.length)]; }
  document.getElementById('s_pass').value=p;
}
function genPin(){
  document.getElementById('s_pin').value=Math.floor(1000+Math.random()*9000);
}
function register(){
  let name=document.getElementById('s_name').value;
  let phone=document.getElementById('s_phone').value;
  if(!name || !phone){ alert('اكتب اسم المعرض ورقم التواصل الاول'); return; }
  alert('تم تسجيل معرضك يا '+name+' ✅\nادفع الاشتراك عشان صفحتك تشتغل');
}
</script>
</body>
</html>
