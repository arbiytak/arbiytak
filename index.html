<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عربيتك | سوق العربيات في مصر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8fbf8;max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}
.header{background:#00AA06;color:#fff;padding:22px 16px 32px;border-radius:0 0 24px 24px;text-align:center}
.header h1{font-size:28px;font-weight:900}
.header p{opacity:.9;font-size:14px;margin-top:4px}
.search{margin:-18px 16px 12px;background:#fff;border-radius:16px;padding:12px;display:flex;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.search input{flex:1;border:1px solid #eee;border-radius:12px;padding:12px;outline:none}
.search button{background:#00AA06;color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:800}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 16px}
.filters button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}
.filters button.active{background:#00AA06;color:#fff;border-color:#00AA06}
.section{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center}
.section h2{font-size:18px}
.grid{padding:12px 16px;display:grid;gap:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:12px}
.price{color:#00AA06;font-weight:900;font-size:19px}
.card-body h3{font-size:16px;margin:4px 0}
.meta{color:#777;font-size:13px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions a,.actions button{flex:1;text-align:center;padding:11px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px;cursor:pointer}
.wa{background:#25D366;color:#fff;border:none}
.details{background:#111;color:#fff;border:none}
.fav{position:absolute;top:10px;left:10px;background:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px}
.imgwrap{position:relative}
.add-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#00AA06;color:#fff;border:none;padding:14px 22px;border-radius:999px;font-weight:900;box-shadow:0 8px 20px rgba(0,170,6,.4);z-index:10}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
nav a{text-decoration:none;color:#333;text-align:center;font-size:13px}
nav a.active{color:#00AA06;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:end}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}
.modal-box input,.modal-box select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:6px;margin-bottom:12px}
.modal-box button{width:100%;background:#00AA06;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900}
</style>
</head>
<body>
<div class="header"><h1>🚗 عربيتك</h1><p>بيع واشتري عربيتك في مصر مجاناً</p></div>
<div class="search"><input id="searchInput" placeholder="دور على عربية... كور
            <div class="filters" id="filters"><button class="active" onclick="filterBrand('الكل',this)">الكل</button><button onclick="filterBrand('Toyota',this)">Toyota</button><button onclick="filterBrand('Hyundai',this)">Hyundai</button><button onclick="filterBrand('Kia',this)">Kia</button><button onclick="filterBrand('Nissan',this)">Nissan</button><button onclick="filterBrand('MG',this)">MG</button></div>
<div class="section"><h2>عربيات للبيع 🔥</h2><span id="count"></span></div>
<div class="grid" id="cars"></div>
<button class="add-btn" onclick="openModal()">+ اعرض عربيتك مجاناً</button>
<nav><a href="#" class="active">🏠<br>الرئيسية</a><a href="#" onclick="openModal()">➕<br>إضافة</a><a href="#" onclick="showFav()">❤️<br>المفضلة</a></nav>
<div class="modal" id="modal"><div class="modal-box"><h2>أضف عربيتك للبيع</h2><p style="color:#777;font-size:13px;margin:6px 0 14px">املأ البيانات وهننشرها بعد المراجعة</p><label>الماركة</label><select id="b"><option>Toyota</option><option>Hyundai</option><option>Kia</option><option>Nissan</option><option>MG</option></select><label>الموديل</label><input id="m" placeholder="مثال: كورولا"><label>السنة</label><input id="y" type="number" placeholder="2022"><label>السعر</label><input id="p" type="number" placeholder="850000"><label>المدينة</label><select id="c"><option>الحسينية</option><option>الزقازيق</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>المنصورة</option></select><label>واتساب</label><input id="w" placeholder="01xxxxxxxxx"><button onclick="addCar()">انشر عربيتك مجاناً</button><button style="background:#eee;color:#333;margin-top:8px" onclick="closeModal()">إلغاء</button></div></div>
<script>
let allCars=[{brand:'Toyota',model:'كورولا',year:2022,price:950000,city:'الزقازيق',km:'45,000 كم',img:'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=800',wa:'201000000000'},{brand:'Hyundai',model:'النترا',year:2021,price:780000,city:'القاهرة',km:'60,000 كم',img:'https://images.unsplash.com/photo-1619767886558-efdc259cde1a?w=800',wa:'201000000000'},{brand:'Kia',model:'سبورتاج',year:2023,price:1250000,city:'الجيزة',km:'20,000 كم',img:'https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800',wa:'201000000000'},{brand:'Nissan',model:'صني',year:2020,price:520000,city:'الحسينية',km:'80,000 كم',img:'https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=800',wa:'201000000000'},{brand:'MG',model:'ZS',year:2022,price:680000,city:'المنصورة',km:'35,000 كم',img:'https://images.unsplash.com/photo-1614200187524-dc4b892acf16?w=800',wa:'201000000000'}];
let favs=new Set();let cur='الكل';
function render(list){let el=document.getElementById('cars');document.getElementById('count').innerText=list.length+' عربية';el.innerHTML=list.map((car,i)=>`<div class="card"><div class="imgwrap"><img src="${car.img}"><button class="fav" onclick="toggleFav(${i})">${favs.has(i)?'❤️':'🤍'}</button></div><div class="card-body"><div class="price">${car.price.toLocaleString()} ج.م</div><h3>${car.brand} ${car.model} ${car.year}</h3><div class="meta">${car.city} • ${car.km} • أوتوماتيك</div><div class="actions"><a class="wa" href="https://wa.me/${car.wa}">واتساب</a><button class="details" onclick="alert('${car.brand} ${car.model} - ${car.city}')">التفاصيل</button></div></div></div>`).join('')}
function filterBrand(b,btn){cur=b;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');apply()}
function doSearch(){apply()}
function apply(){let q=document.getElementById('searchInput').value;let f=allCars.filter(c=>(cur==='الكل'||c.brand===cur)&&(c.model.includes(q)||c.brand.toLowerCase().includes(q.toLowerCase())||q==''));render(f)}
function toggleFav(i){favs.has(i)?favs.delete(i):favs.add(i);apply()}
function showFav(){let f=allCars.filter((_,i)=>favs.has(i));render(f);window.scrollTo(0,0)}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addCar(){let car={brand:document.getElementById('b').value,model:document.getElementById('m').value||'موديل',year:document.getElementById('y').value||2024,price:+document.getElementById('p').value||0,city:document.getElementById('c').value,km:'0 كم',img:'https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800',wa:document.getElementById('w').value||'201000000000'};allCars.unshift(car);closeModal();apply();alert('عربيتك اتبعتت للمراجعة ✅')}
render(allCars);
</script>
</body>
</html>
